<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <!--
            モバイル端末では画面の拡大を禁止する。
            ・user-scalable=no / maximum-scale=1 … Android・iOS（最近の版）・各種 WebView
            ・iOS Safari は上記を無視する場合があるため、utils/zoomControl.ts で
              ピンチ操作を止める（二重の対策）
        -->
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"
        />
        <meta name="theme-color" content="#000000" />
        <link rel="manifest" href="./manifest.json" />
        <link rel="shortcut icon" href="./src/assets/icons/D.png" />
        <title>外部倉庫管理システム（仮称）</title>
        <style>
            /*
             * 画面の高さ（--app-vh）
             *
             * モバイルブラウザの 100vh は「アドレスバーや下部ツールバーが隠れた状態」の
             * 高さを指すため、そのまま使うと画面下端がブラウザのツールバーに隠れる。
             * dvh（動的ビューポート）が使える端末ではそちらを優先し、
             * 未対応の端末では utils/viewportHeight.ts が実際の高さを px で代入する。
             */
            :root {
                --app-vh: 100vh;
            }

            @supports (height: 100dvh) {
                :root {
                    --app-vh: 100dvh;
                }
            }

            html {
                height: var(--app-vh);
                overflow: hidden;
                -webkit-text-size-adjust: 100%;
                text-size-adjust: 100%;
            }

            body {
                height: var(--app-vh);
                margin: 0;
                padding: 0;
                overflow: hidden;
                touch-action: manipulation;
            }

            #root {
                height: var(--app-vh);
                overflow: hidden;
            }

            @media (max-width: 1023.9px) {
                input:not([type='checkbox']):not([type='radio']):not([type='range']),
                textarea,
                select {
                    font-size: 16px !important;
                }
            }

            .loader-container {
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
                position: absolute;
                top: 0;
                bottom: 0;
                left: 0;
                right: 0;
                background-color: #fafafa;
            }

            /* CSS Spinner from https://projects.lukehaas.me/css-loaders/ */

            .loader,
            .loader:before,
            .loader:after {
                border-radius: 50%;
            }

            .loader {
                color: #283593;
                font-size: 11px;
                text-indent: -99999em;
                margin: 55px auto;
                position: relative;
                width: 10em;
                height: 10em;
                box-shadow: inset 0 0 0 1em;
                -webkit-transform: translateZ(0);
                -ms-transform: translateZ(0);
                transform: translateZ(0);
            }

            .loader:before,
            .loader:after {
                position: absolute;
                content: '';
            }

            .loader:before {
                width: 5.2em;
                height: 10.2em;
                background: #fafafa;
                border-radius: 10.2em 0 0 10.2em;
                top: -0.1em;
                left: -0.1em;
                -webkit-transform-origin: 5.2em 5.1em;
                transform-origin: 5.2em 5.1em;
                -webkit-animation: load2 2s infinite ease 1.5s;
                animation: load2 2s infinite ease 1.5s;
            }

            .loader:after {
                width: 5.2em;
                height: 10.2em;
                background: #fafafa;
                border-radius: 0 10.2em 10.2em 0;
                top: -0.1em;
                left: 5.1em;
                -webkit-transform-origin: 0px 5.1em;
                transform-origin: 0px 5.1em;
                -webkit-animation: load2 2s infinite ease;
                animation: load2 2s infinite ease;
            }

            @-webkit-keyframes load2 {
                0% {
                    -webkit-transform: rotate(0deg);
                    transform: rotate(0deg);
                }
                100% {
                    -webkit-transform: rotate(360deg);
                    transform: rotate(360deg);
                }
            }

            @keyframes load2 {
                0% {
                    -webkit-transform: rotate(0deg);
                    transform: rotate(0deg);
                }
                100% {
                    -webkit-transform: rotate(360deg);
                    transform: rotate(360deg);
                }
            }
        </style>
        <link rel="preconnect" href="https://fonts.gstatic.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600;700;900&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
            rel="stylesheet"
        />
    </head>

    <body>
        <noscript> You need to enable JavaScript to run this app. </noscript>
        <div id="root">
            <div class="loader-container">
                <div class="loader">Loading...</div>
            </div>
        </div>
    </body>
    <script type="module" src="/src/index.tsx"></script>
</html>
